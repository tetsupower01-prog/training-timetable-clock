<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="時間割時計" />
    <meta name="theme-color" content="#141d29" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <title>訓練時間割時計</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }

      :root {
        --bg: #edf0f3;
        --surface: #ffffff;
        --ink: #17202b;
        --muted: #5d6d7e;
        --faint: #8b99a9;
        --line: #dde3ea;
        --accent: #d9481f;
        --accent-ink: #b23a17;
        --accent-soft: #fdeee8;
        --calm: #17705a;
        --calm-soft: #e4f2ec;
        --amber: #a86a08;
        --amber-soft: #fdf3dd;
        --panel: #141d29;
        --panel-2: #1d2939;
        --panel-ink: #f2f5f8;
        --panel-muted: #9fb0c2;
        --panel-accent: #ff8a5f;
        --panel-track: #33415568;
        --shadow: 0 10px 30px rgba(23, 32, 43, .10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f141a;
          --surface: #1a222d;
          --ink: #edf2f7;
          --muted: #a3b1c1;
          --faint: #77879a;
          --line: #2b3644;
          --accent: #ff7a4d;
          --accent-ink: #ffa07e;
          --accent-soft: #3a231b;
          --calm: #4cc2a2;
          --calm-soft: #173129;
          --amber: #e8b34b;
          --amber-soft: #33290f;
          --panel: #080d13;
          --panel-2: #111a25;
          --panel-ink: #f2f5f8;
          --panel-muted: #8fa2b5;
          --panel-accent: #ff8a5f;
          --shadow: 0 10px 30px rgba(0, 0, 0, .35);
        }
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        line-height: 1.55;
      }
      .mono { font-family: "IBM Plex Mono", "Noto Sans JP", monospace; font-variant-numeric: tabular-nums; }

      .wrap {
        max-width: 600px;
        margin: 0 auto;
        padding: 18px 16px 40px;
      }

      /* ---------- date row ---------- */
      .date-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 2px 2px 12px;
      }
      .date-row .date {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .02em;
      }
      .date-row .school {
        font-size: 12.5px;
        color: var(--muted);
        text-align: right;
      }

      /* ---------- now panel ---------- */
      .panel {
        background: linear-gradient(160deg, var(--panel-2), var(--panel) 55%);
        color: var(--panel-ink);
        border-radius: 20px;
        padding: 22px 20px 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .clock {
        font-size: clamp(58px, 17vw, 84px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: .01em;
      }
      .clock .sec { font-size: .42em; color: var(--panel-muted); font-weight: 500; margin-left: 4px; }

      .now-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 14px;
        align-items: end;
        margin-top: 18px;
      }
      .now-label {
        font-size: 13px;
        color: var(--panel-muted);
        font-weight: 500;
      }
      .now-name {
        font-size: clamp(34px, 9.5vw, 46px);
        font-weight: 900;
        line-height: 1.15;
        margin-top: 2px;
      }
      .now-name .now-range {
        display: block;
        font-size: 15px;
        font-weight: 500;
        color: var(--panel-muted);
        margin-top: 4px;
        letter-spacing: .03em;
      }
      .cat-box { width: 104px; flex: none; }
      .cat-box svg { display: block; width: 100%; height: auto; }
      .cat-tail {
        transform-origin: 88% 78%;
        animation: tail 3.2s ease-in-out infinite;
      }
      @keyframes tail {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-7deg); }
      }
      .cat-eyes { animation: blink 5.4s infinite; transform-origin: center 42%; }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cat-tail, .cat-eyes { animation: none; }
      }

      .bubble {
        grid-column: 1 / -1;
        background: rgba(255, 255, 255, .08);
        border-radius: 12px;
        padding: 9px 13px;
        font-size: 14px;
        color: var(--panel-ink);
      }
      .bubble b { color: var(--panel-accent); font-weight: 700; }

      .count-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .count-label { font-size: 14px; color: var(--panel-muted); font-weight: 500; }
      .count {
        font-size: clamp(40px, 12vw, 56px);
        font-weight: 700;
        line-height: 1;
        color: var(--panel-accent);
      }
      .count-note { font-size: 13px; color: var(--panel-muted); }

      .bar {
        height: 10px;
        border-radius: 99px;
        background: rgba(255, 255, 255, .14);
        margin-top: 14px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: var(--panel-accent);
        transition: width .6s linear;
      }
      .bar-meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--panel-muted);
        margin-top: 6px;
      }

      .next-box {
        margin-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, .12);
        padding-top: 14px;
        display: grid;
        gap: 5px;
      }
      .next-line { font-size: 16.5px; font-weight: 700; }
      .next-line .t { color: var(--panel-accent); }
      .next-sub { font-size: 13.5px; color: var(--panel-muted); }

      /* ---------- day progress ---------- */
      .day-progress {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 2px 6px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .day-progress .bar {
        flex: 1;
        margin: 0;
        height: 7px;
        background: var(--line);
      }
      .day-progress .bar > i { background: var(--accent); }
      .day-progress .pct { font-weight: 700; color: var(--ink); min-width: 3.2em; text-align: right; }

      /* ---------- timetable ---------- */
      h2.list-title {
        font-size: 15px;
        font-weight: 900;
        margin: 20px 2px 10px;
        letter-spacing: .04em;
      }
      .list { display: grid; gap: 6px; }
      .row {
        display: grid;
        grid-template-columns: 102px 1fr auto;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .row-time { font-size: 15px; font-weight: 600; line-height: 1.3; }
      .row-time span { display: block; font-size: 12px; color: var(--faint); font-weight: 500; }
      .row-name { font-size: 17px; font-weight: 700; }
      .row-sub { font-size: 12px; color: var(--muted); }
      .chip {
        font-size: 11.5px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 99px;
        background: var(--bg);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip:empty { visibility: hidden; }
      .row.is-past { opacity: .52; }
      .row.is-past .chip { background: transparent; color: var(--faint); padding-right: 2px; }
      .row.is-now {
        border-color: transparent;
        background: var(--accent-soft);
        box-shadow: var(--shadow);
      }
      .row.is-now .row-name { color: var(--accent-ink); }
      .row.is-now .chip { background: var(--accent); color: #fff; }
      .row.is-next .chip { background: var(--calm-soft); color: var(--calm); }

      .row.kind-break, .row.kind-entry {
        padding-top: 8px;
        padding-bottom: 8px;
        background: transparent;
        border-style: dashed;
      }
      .row.kind-break .row-name, .row.kind-entry .row-name { font-size: 14.5px; font-weight: 500; color: var(--muted); }
      .row.kind-break .row-time, .row.kind-entry .row-time { font-size: 13.5px; color: var(--muted); }
      .row.kind-break.is-now, .row.kind-entry.is-now { background: var(--calm-soft); border-style: solid; box-shadow: none; }
      .row.kind-break.is-now .row-name, .row.kind-entry.is-now .row-name { color: var(--calm); font-weight: 700; }
      .row.kind-break.is-now .chip, .row.kind-entry.is-now .chip { background: var(--calm); color: #fff; }
      .row.kind-lunch.is-now { background: var(--amber-soft); }
      .row.kind-lunch.is-now .row-name { color: var(--amber); }
      .row.kind-lunch.is-now .chip { background: var(--amber); }

      .foot {
        margin-top: 22px;
        font-size: 12.5px;
        color: var(--faint);
        text-align: center;
        line-height: 1.7;
      }

      @media (max-width: 380px) {
        .row { grid-template-columns: 100px 1fr auto; padding: 11px 12px; }
        .cat-box { width: 84px; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="date-row">
        <div class="date" id="dateText">—</div>
        <div class="school">職業訓練<br />AI・Web・マーケティング総合科</div>
      </div>

      <section class="panel" aria-label="現在時刻と今の時限">
        <div class="clock mono"><span id="clockHM">--:--</span><span class="sec" id="clockS">--</span></div>

        <div class="now-head">
          <div>
            <div class="now-label" id="nowLabel">いまは</div>
            <div class="now-name"><span id="nowName">読み込み中</span><span class="now-range mono" id="nowRange"></span></div>
          </div>
          <div class="cat-box" aria-hidden="true">
            <!-- 三毛猫（みかん箱入り） -->
            <svg viewBox="0 0 120 108" role="img" aria-label="みかん箱に入った三毛猫">
              <!-- tail -->
              <path class="cat-tail" d="M102 84 q14 -4 12 -20 q-1 -9 -8 -12" fill="none" stroke="#f5f2ec" stroke-width="8" stroke-linecap="round"/>
              <path class="cat-tail" d="M106 66 q3 -1 5 -4" fill="none" stroke="#e8873a" stroke-width="8" stroke-linecap="round"/>
              <!-- ears -->
              <path d="M38 30 L34 10 Q33 5 38 7 L52 14 Z" fill="#e8873a"/>
              <path d="M82 30 L86 10 Q87 5 82 7 L68 14 Z" fill="#3a3f46"/>
              <!-- head -->
              <circle cx="60" cy="42" r="27" fill="#f5f2ec"/>
              <path d="M40 24 a27 27 0 0 1 18 -9 l-2 14 q-9 2 -16 -5 Z" fill="#e8873a" opacity=".9"/>
              <path d="M86 34 a27 27 0 0 0 -8 -15 l-3 13 q5 4 11 2 Z" fill="#3a3f46" opacity=".88"/>
              <!-- face -->
              <g class="cat-eyes">
                <circle cx="49" cy="42" r="3.1" fill="#2b2f36"/>
                <circle cx="71" cy="42" r="3.1" fill="#2b2f36"/>
              </g>
              <path d="M57 50 q3 2.4 6 0 q-1 3.4 -3 3.4 q-2 0 -3 -3.4 Z" fill="#e58aa0"/>
              <path d="M60 54 q-2 4 -6 3 M60 54 q2 4 6 3" fill="none" stroke="#8a7f72" stroke-width="1.6" stroke-linecap="round"/>
              <g stroke="#b9ac9c" stroke-width="1.4" stroke-linecap="round">
                <path d="M30 46 L16 43"/><path d="M31 53 L18 54"/>
                <path d="M90 46 L104 43"/><path d="M89 53 L102 54"/>
              </g>
              <!-- paws on box -->
              <ellipse cx="42" cy="72" rx="8" ry="5.5" fill="#f5f2ec"/>
              <ellipse cx="78" cy="72" rx="8" ry="5.5" fill="#f5f2ec"/>
              <!-- mikan box -->
              <path d="M14 70 h92 l-5 32 a4 4 0 0 1 -4 3.4 H23 a4 4 0 0 1 -4 -3.4 Z" fill="#c98d4e"/>
              <path d="M14 70 h92 l-1.4 9 H15.4 Z" fill="#b57a3c"/>
              <rect x="48" y="82" width="24" height="13" rx="2" fill="#e9dcc4"/>
              <circle cx="60" cy="88.5" r="4.4" fill="#e8873a"/>
              <path d="M60 84.6 q1 -2.4 3.4 -2.8" fill="none" stroke="#5d7d3a" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="bubble" id="catBubble">…</div>
        </div>

        <div class="count-row">
          <div class="count-label" id="countLabel">あと</div>
          <div class="count mono" id="count">--:--</div>
          <div class="count-note" id="countNote"></div>
        </div>
        <div class="bar" aria-hidden="true"><i id="slotBar"></i></div>
        <div class="bar-meta mono"><span id="barStart"></span><span id="barPct"></span><span id="barEnd"></span></div>

        <div class="next-box">
          <div class="next-line" id="nextLine">次は —</div>
          <div class="next-sub" id="nextSub"></div>
        </div>
      </section>

      <div class="day-progress">
        <span>今日の進行</span>
        <div class="bar" aria-hidden="true"><i id="dayBar"></i></div>
        <span class="pct mono" id="dayPct">0%</span>
      </div>

      <h2 class="list-title">一日の時間割</h2>
      <div class="list" id="list"></div>

      <p class="foot">入室 9:10 ／ 授業 9:30〜16:10<br />50分授業 ＋ 10分休憩のリズム ・ 昼食 13:20〜14:20</p>
    </main>

    <script>
      // ---- timetable (minutes from midnight) ----
      function hm(h, m) { return h * 60 + m; }
      var SLOTS = [
        { kind: "entry",  name: "入室・準備", start: hm(9,10),  end: hm(9,30),  range: "9:10 〜 9:30",  sub: "入室可能 9:10" },
        { kind: "lesson", name: "1限", start: hm(9,30),  end: hm(10,20), range: "9:30 〜 10:20", sub: "50分" },
        { kind: "break",  name: "休憩", start: hm(10,20), end: hm(10,30), range: "10:20 〜 10:30", sub: "10分" },
        { kind: "lesson", name: "2限", start: hm(10,30), end: hm(11,20), range: "10:30 〜 11:20", sub: "50分" },
        { kind: "break",  name: "休憩", start: hm(11,20), end: hm(11,30), range: "11:20 〜 11:30", sub: "10分" },
        { kind: "lesson", name: "3限", start: hm(11,30), end: hm(12,20), range: "11:30 〜 12:20", sub: "50分" },
        { kind: "break",  name: "休憩", start: hm(12,20), end: hm(12,30), range: "12:20 〜 12:30", sub: "10分" },
        { kind: "lesson", name: "4限", start: hm(12,30), end: hm(13,20), range: "12:30 〜 13:20", sub: "50分" },
        { kind: "lunch",  name: "昼食", start: hm(13,20), end: hm(14,20), range: "13:20 〜 14:20", sub: "60分" },
        { kind: "lesson", name: "5限", start: hm(14,20), end: hm(15,10), range: "14:20 〜 15:10", sub: "50分" },
        { kind: "break",  name: "休憩", start: hm(15,10), end: hm(15,20), range: "15:10 〜 15:20", sub: "10分" },
        { kind: "lesson", name: "6限", start: hm(15,20), end: hm(16,10), range: "15:20 〜 16:10", sub: "50分" }
      ];
      var DAY_START = hm(9, 10), DAY_END = hm(16, 10);
      var WEEK = ["日", "月", "火", "水", "木", "金", "土"];

      function fmtMin(min) {
        var h = Math.floor(min / 60), m = min % 60;
        return h + ":" + (m < 10 ? "0" : "") + m;
      }
      function fmtCount(sec) {
        sec = Math.max(0, Math.round(sec));
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        function p(n) { return (n < 10 ? "0" : "") + n; }
        return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);
      }
      function $(id) { return document.getElementById(id); }

      // ---- build timetable rows ----
      var listEl = $("list");
      var rows = SLOTS.map(function (slot, i) {
        var row = document.createElement("div");
        row.className = "row kind-" + slot.kind;
        var timeParts = slot.range.split(" 〜 ");
        row.innerHTML =
          '<div class="row-time mono">' + timeParts[0] + '<span>〜 ' + timeParts[1] + '</span></div>' +
          '<div><div class="row-name">' + slot.name + '</div><div class="row-sub">' + slot.sub + '</div></div>' +
          '<div class="chip"></div>';
        listEl.appendChild(row);
        return row;
      });
      var endRow = document.createElement("div");
      endRow.className = "row kind-break";
      endRow.innerHTML =
        '<div class="row-time mono">16:10<span>終了</span></div>' +
        '<div><div class="row-name">下校</div><div class="row-sub">今日の授業はここまで</div></div>' +
        '<div class="chip"></div>';
      listEl.appendChild(endRow);

      var CAT = {
        before: "まだ入室前だにゃ。あわてなくて大丈夫。",
        entry:  "入室できたにゃ。<b>9:30</b> から1限が始まるよ。",
        lesson: "授業中だにゃ。ちらっと確認したら、また集中。",
        break:  "休憩にゃ〜。のびをして、水分をとって。",
        lunch:  "お昼ごはんだにゃ。しっかり食べて午後もいこう。",
        after:  "今日はおつかれさまにゃ。ゆっくり休んで。"
      };

      var lastSec = -1;
      function tick() {
        var now = new Date();
        var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        function p(n) { return (n < 10 ? "0" : "") + n; }
        // 秒が変わったときだけ時計の数字を書き換える。
        // チェックは0.25秒ごとに行うので、タイマーが少し遅れても秒が飛んで見えない。
        if (h * 3600 + m * 60 + s !== lastSec) {
          lastSec = h * 3600 + m * 60 + s;
          $("clockHM").textContent = p(h) + ":" + p(m);
          $("clockS").textContent = p(s);
          $("dateText").textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日（" + WEEK[now.getDay()] + "）";
        }

        var nowMin = h * 60 + m + s / 60;
        var nowSec = h * 3600 + m * 60 + s;

        // find current slot
        var cur = -1;
        for (var i = 0; i < SLOTS.length; i++) {
          if (nowMin >= SLOTS[i].start && nowMin < SLOTS[i].end) { cur = i; break; }
        }
        var state, curSlot = cur >= 0 ? SLOTS[cur] : null;
        if (nowMin < DAY_START) state = "before";
        else if (nowMin >= DAY_END) state = "after";
        else state = curSlot.kind; // entry | lesson | break | lunch

        // ---- now panel ----
        var label, name, range, countLabel, targetSec, barFrom, barTo, nextLine, nextSub, bubbleKey;
        if (state === "before") {
          label = "授業開始まで"; name = "入室前"; range = "入室可能 9:10 ／ 1限 9:30〜";
          countLabel = "入室まで あと"; targetSec = DAY_START * 60;
          barFrom = 0; barTo = DAY_START * 60;
          nextLine = '次は <span class="t">入室・準備</span> 9:10〜';
          nextSub = "1限は 9:30 〜 10:20";
          bubbleKey = "before";
        } else if (state === "after") {
          label = "本日の訓練は"; name = "終了"; range = "6限は 16:10 に終了";
          countLabel = "終了から"; targetSec = DAY_END * 60;
          barFrom = DAY_END * 60; barTo = 24 * 3600;
          nextLine = "今日の時間割はすべて終了";
          nextSub = "おつかれさまでした";
          bubbleKey = "after";
        } else {
          var endT = curSlot.end * 60;
          label = curSlot.kind === "lesson" ? "いまは" : "いまは";
          name = curSlot.name;
          range = curSlot.range;
          countLabel = (curSlot.kind === "lesson" ? curSlot.name + " 終了まで あと"
            : curSlot.kind === "lunch" ? "昼食 終了まで あと"
            : curSlot.kind === "entry" ? "1限 開始まで あと"
            : "休憩 終了まで あと");
          targetSec = endT; barFrom = curSlot.start * 60; barTo = endT;
          bubbleKey = curSlot.kind;
          // next slot
          var nxt = SLOTS[cur + 1];
          if (nxt) {
            nextLine = '次は <span class="t">' + nxt.name + '</span> ' + fmtMin(nxt.start) + ' 〜 ' + fmtMin(nxt.end);
            var nxt2 = SLOTS[cur + 2];
            nextSub = (nxt.kind === "break" && nxt2) ? "その次は " + nxt2.name + " " + fmtMin(nxt2.start) + " 〜 " + fmtMin(nxt2.end) : "";
          } else {
            nextLine = 'このあと <span class="t">16:10</span> で終了';
            nextSub = "今日の最後の時限です";
          }
        }

        $("nowLabel").textContent = label;
        $("nowName").textContent = name;
        $("nowRange").textContent = range;
        $("countLabel").textContent = countLabel;
        $("nextLine").innerHTML = nextLine;
        $("nextSub").textContent = nextSub;
        $("catBubble").innerHTML = CAT[bubbleKey];

        if (state === "after") {
          $("count").textContent = fmtCount(nowSec - targetSec);
          $("countNote").textContent = "経過";
          $("slotBar").style.width = "100%";
          $("barStart").textContent = "16:10"; $("barEnd").textContent = "";
          $("barPct").textContent = "終了";
        } else {
          $("count").textContent = fmtCount(targetSec - nowSec);
          $("countNote").textContent = state === "before" ? "" : "残り時間";
          var pct = Math.min(100, Math.max(0, (nowSec - barFrom) / (barTo - barFrom) * 100));
          $("slotBar").style.width = pct.toFixed(1) + "%";
          $("barStart").textContent = state === "before" ? "" : fmtMin(barFrom / 60);
          $("barEnd").textContent = fmtMin(barTo / 60);
          $("barPct").textContent = state === "before" ? "" : Math.floor(pct) + "% 経過";
        }

        // ---- day progress ----
        var dayPct = Math.min(100, Math.max(0, (nowMin - DAY_START) / (DAY_END - DAY_START) * 100));
        $("dayBar").style.width = dayPct.toFixed(1) + "%";
        $("dayPct").textContent = Math.floor(dayPct) + "%";

        // ---- rows highlight ----
        rows.forEach(function (row, i) {
          row.classList.remove("is-now", "is-past", "is-next");
          var chip = row.querySelector(".chip");
          chip.textContent = "";
          if (state === "after" || nowMin >= SLOTS[i].end) {
            row.classList.add("is-past"); chip.textContent = "終了";
          } else if (i === cur) {
            row.classList.add("is-now"); chip.textContent = "今ここ";
          } else if (cur >= 0 && i === cur + 1) {
            row.classList.add("is-next"); chip.textContent = "次";
          } else if (state === "before" && i === 0) {
            row.classList.add("is-next"); chip.textContent = "次";
          }
        });
        var eChip = endRow.querySelector(".chip");
        endRow.classList.toggle("is-now", state === "after");
        eChip.textContent = state === "after" ? "今ここ" : "";
      }

      tick();
      setInterval(tick, 250);
      // 画面が裏に回ってタイマーが間引かれていた場合も、戻った瞬間に正しい時刻へ直す
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) tick();
      });
    </script>
  </body>
</html>
